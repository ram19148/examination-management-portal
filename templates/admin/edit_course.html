<!-- templates/admin/edit_course.html -->
<!-- ==============================================================================
     Existing course ke code, name, description aur status ko edit karne ka form.
     ============================================================================== -->
{% extends 'base.html' %}
{% block title %}Edit Course - Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-modern">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-3">✏️ Edit Course: {{ course.course_code }}</h4>
                <form method="POST" action="{{ url_for('edit_course', course_id=course.id) }}">
                    <!-- Course Code -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Code</label>
                        <input type="text" name="course_code" class="form-control" value="{{ course.course_code }}" required>
                    </div>
                    <!-- Course Title -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Course Name</label>
                        <input type="text" name="course_name" class="form-control" value="{{ course.course_name }}" required>
                    </div>
                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ course.description or '' }}</textarea>
                    </div>
                    <!-- Course Status Selector -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Status</label>
                        <select name="status" class="form-select">
                            <option value="Active" {% if course.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Archived" {% if course.status == 'Archived' %}selected{% endif %}>Archived</option>
                        </select>
                    </div>
                    <!-- Actions -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary-gradient flex-grow-1">Save Changes</button>
                        <a href="{{ url_for('admin_courses') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
